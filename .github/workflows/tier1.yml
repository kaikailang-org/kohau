name: tier1

# Run kohau's tier1 fixtures on GitHub's standard hosted runner.
#
# Runner: `macos-14` — a GitHub-hosted runner (free for public
# repos), NOT self-hosted or private. macOS specifically because the
# public kaikai toolchain only ships a `darwin-arm64` binary today;
# there is no Linux release, so `ubuntu-latest` would have to build
# the compiler from source. When kaikai publishes a Linux binary
# this can move to `ubuntu-latest`.
#
# kaikai ships publicly from the `kaikailang-org` Homebrew tap, so
# `kai` is installed the same way a developer installs it — no token,
# no private clone, no building the compiler from source.
#
# Three jobs. `tier1` covers the sqlite surface, which needs nothing
# but a library; `tier1-pg` covers postgres, which needs a live server
# it provisions itself. They are separate so a postgres failure reads
# as one, rather than turning the sqlite signal red.
#
# `tier1-pg-linux` is the second platform, and is non-blocking until
# kaikai publishes a Linux binary — see the note above the job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tier1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out kohau
        uses: actions/checkout@v4

      - name: Install kaikai (public Homebrew tap)
        run: brew install kaikailang-org/kaikai/kaikai

      - name: Install libsqlite3
        run: brew install sqlite

      - name: Toolchain versions
        run: |
          cc --version | head -1
          make --version | head -1
          kai --version

      - name: Resolve dependencies (ahu git-dep)
        # ahu is a public repo, so this clone needs no credentials.
        run: kai install

      - name: kohau tier0 (compile module + fixtures)
        run: make tier0

      - name: kohau tier1 (run fixtures + diff outputs)
        run: make tier1

  # The postgres fixtures need a live server, so they run as their own
  # job: a failure here is a postgres failure, not a silent tier1 one.
  #
  # GitHub's `services:` containers are Linux-only and this runner is
  # macOS (see the note at the top), so the server is provisioned the
  # way a developer does it locally — initdb into a scratch directory,
  # pg_ctl to start it. `libpq` and `postgresql@18` are both installed:
  # postgresql@18 does ship libpq, but under `include/postgresql/` and
  # `lib/postgresql/`, which are not the paths the Makefile defaults
  # to; the standalone formula puts them where it expects.
  tier1-pg:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # A short socket directory: a Unix socket path is capped at ~103
      # bytes and the runner's workspace path is long enough to blow
      # that on its own.
      PGHOST: /tmp/kohau-pg
      PGUSER: postgres
      PGDATABASE: kohau_test
      PGDATA_DIR: /tmp/kohau-pgdata
    steps:
      - name: Check out kohau
        uses: actions/checkout@v4

      - name: Install kaikai (public Homebrew tap)
        run: brew install kaikailang-org/kaikai/kaikai

      - name: Install libpq and the postgres server
        run: brew install libpq postgresql@18

      - name: Toolchain versions
        run: |
          cc --version | head -1
          kai --version
          /opt/homebrew/opt/postgresql@18/bin/postgres --version

      - name: Start a scratch postgres cluster
        run: |
          export PATH="/opt/homebrew/opt/postgresql@18/bin:$PATH"
          mkdir -p "$PGHOST"
          initdb -D "$PGDATA_DIR" -A trust -U postgres --locale=C -E UTF8
          # -h '' keeps it off TCP entirely; it is reachable only
          # through the socket directory above.
          pg_ctl -D "$PGDATA_DIR" -o "-k $PGHOST -h ''" -l "$PGDATA_DIR/server.log" start
          for i in $(seq 1 30); do
            /opt/homebrew/opt/libpq/bin/psql -tAc 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          /opt/homebrew/opt/libpq/bin/createdb "$PGDATABASE"

      - name: Resolve dependencies (ahu git-dep)
        run: kai install

      - name: kohau tier0-pg (compile the postgres module + fixtures)
        run: make tier0-pg

      - name: kohau tier1-pg (run fixtures + diff outputs)
        run: make tier1-pg

      - name: kohau tier1-pg-reconnect (restart the server mid-run)
        run: |
          export PATH="/opt/homebrew/opt/postgresql@18/bin:/opt/homebrew/opt/libpq/bin:$PATH"
          make tier1-pg-reconnect

      - name: Server log on failure
        if: failure()
        run: tail -50 "$PGDATA_DIR/server.log" || true

  # Linux coverage, non-blocking until kaikai ships a Linux binary.
  #
  # The toolchain is the only thing missing: as of v0.105.1 the
  # release publishes `darwin-arm64` alone and the Homebrew formula
  # carries just an `on_macos` block, so the install step below fails
  # and `continue-on-error` keeps that from gating the merge queue.
  # Everything after it is real and ready — the job stops being a
  # placeholder the day a linux-x64 artefact exists, by deleting the
  # `continue-on-error` line.
  #
  # Why it is worth carrying meanwhile: kohau's C shims are the part
  # most likely to break on a second platform. `long` vs `int64_t`
  # widths, header locations, and the default library search path all
  # differ, and none of that is exercised by a macOS-only matrix.
  #
  # Unlike the macOS job this one uses a service container — they are
  # Linux-only, which is exactly the platform here — so postgres is
  # provisioned by the runner rather than by initdb. The consequence
  # is that `tier1-pg-reconnect` is NOT run: it drives `pg_ctl`
  # against the server's data directory, which lives inside the
  # container and is not reachable from the job.
  tier1-pg-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kohau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Over TCP rather than a socket: the server is in a container,
      # so there is no shared socket directory.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kohau_test
    steps:
      - name: Check out kohau
        uses: actions/checkout@v4

      - name: Install libpq and libsqlite3 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libsqlite3-dev postgresql-client

      - name: Install kaikai
        # No Linux artefact is published yet; this is the step that
        # fails today and the one that will start working unchanged.
        run: |
          echo "kaikai publishes darwin-arm64 only as of v0.105.1."
          echo "Replace this step with the Linux install once an"
          echo "artefact exists; everything below already works."
          exit 1

      - name: Toolchain versions
        run: |
          cc --version | head -1
          pg_config --version
          kai --version

      - name: Resolve dependencies (ahu git-dep)
        run: kai install

      - name: kohau tier1 (sqlite)
        run: make tier1

      - name: kohau tier1-pg (postgres)
        # tier1-pg-reconnect is absent by design: it needs pg_ctl on
        # the data directory, which lives inside the service container.
        run: make tier1-pg
