name = "kohau"
version = "0.4.0"
edition = "hanga-roa"

[dependencies]

# ahu (concurrency / fault-tolerance, layer 2). kohau's
# cell-wrapped client (`kohau.sqlite.client`) is built on ahu
# cells: the connection is owned by an `ahu.cell` step function.
# Resolved as a git dependency; `kai install` fetches the tagged
# release into the user-level cache. This is the foundational
# principle documented in README §*kohau builds on ahu* — the
# ergonomic surface is a cell, not raw kaikai primitives.
ahu = { source = "github.com/kaikailang-org/ahu", ref = "v0.2.1" }

# kohau's own fixtures import kohau's #[unstable] declarations: the
# low-level sqlite and postgres bindings, and the cell-wrapped client
# over each. A key is the declaration's module path mangled the way
# the compiler reports it, package name included, so an entry
# silences only the module it names — a bare `sqlite` matches nothing.
# Acknowledging the disclosure here keeps the in-tree build
# warning-free; downstream consumers do the same in their own kai.toml.
[unstable]
kohau__sqlite = true
kohau__sqlite__client = true
kohau__postgres = true
kohau__postgres__client = true

# The sqlite shim travels with the package: a consumer that imports
# `kohau.sqlite` gets it compiled and linked by plain `kai build`,
# with no flags of its own. Only the sqlite shim — the postgres one
# binds libpq, which lives outside the default search path on macOS,
# and the table has no way to name a library directory.
[native]
sources = ["c/sqlite_shim.c"]
include = ["c"]
libs = ["sqlite3"]
